<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Borcama uygulamasına dön</title>
    <!--
      E-posta dogrulama ve parola yenileme baglantilari once bu sayfaya doner.
      Sayfa, Supabase'in adres parcasinda gonderdigi oturum anahtarlarini
      uygulamanin kendi URL semasina aktarir.

      Dogrudan borcama://auth-callback adresine donmek Safari'de calisiyor fakat
      Chrome gibi tarayicilar kullanici dokunusu olmadan ozel semaya gecisi
      engelleyebiliyor; masaustunde ise hic calismiyor. Bu yuzden once otomatik
      denenir, olmazsa kullanici dugmeye basar, isterse tarayicida devam eder.
      Anahtarlar adres parcasinda kalir; sunucuya gonderilmez.
    -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4efe0;
        color: #14160f;
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      main {
        width: min(100%, 460px);
        padding: 30px 26px;
        border: 3px solid #14160f;
        border-radius: 26px;
        background: #fff;
        box-shadow: 10px 10px 0 #ff6f59;
        text-align: center;
      }
      img { width: 150px; height: auto; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 25px; line-height: 1.2; }
      p { margin: 0 0 22px; color: #5d6054; font-size: 15px; line-height: 1.6; }
      .dugme {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 22px;
        border: 2px solid #14160f;
        border-radius: 999px;
        background: #cdf564;
        color: #14160f;
        font-size: 15px;
        font-weight: 800;
        text-decoration: none;
      }
      .ikincil {
        margin-top: 12px;
        background: #fff;
        font-weight: 700;
        font-size: 14px;
      }
      .not { margin: 18px 0 0; font-size: 12px; color: #8a8c7e; }
    </style>
  </head>
  <body>
    <main>
      <img src="/borcama-logo-368.png" alt="Borcama" width="368" height="90" />
      <h1>Hesabın doğrulandı.</h1>
      <p>Borcama uygulamasına dönüyoruz. Uygulama kendiliğinden açılmazsa aşağıdaki düğmeye dokun.</p>
      <a class="dugme" id="uygulama" href="borcama://auth-callback">Uygulamada aç</a>
      <a class="dugme ikincil" id="tarayici" href="/summary">Tarayıcıda devam et</a>
      <p class="not">Bu sayfayı bilgisayarda açtıysan "Tarayıcıda devam et" ile sürdürebilirsin.</p>
    </main>
    <script>
      (function () {
        var parca = window.location.hash || "";
        var sorgu = window.location.search || "";
        // Implicit akista anahtarlar adres parcasinda, PKCE akisinda kod
        // sorguda gelir; ikisini de uygulamaya aktariyoruz.
        var hedef = "borcama://auth-callback" + sorgu + parca;
        var uygulama = document.getElementById("uygulama");
        uygulama.setAttribute("href", hedef);

        var tarayici = document.getElementById("tarayici");
        tarayici.setAttribute("href", "/summary" + parca);

        // Kullanici dokunusu olmadan da denenir; engellenirse dugme kalir.
        window.setTimeout(function () {
          try {
            window.location.replace(hedef);
          } catch (hata) {
            /* dugme ile devam edilir */
          }
        }, 150);
      })();
    </script>
  </body>
</html>
